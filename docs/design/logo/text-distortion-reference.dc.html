<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; background: #cfc9bc; }
a { color: #141210; } a:hover { color: #6b3f2a; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; font-family: ui-monospace, 'SF Mono', Menlo, monospace; color: #141210;">
  <div style="width: 100%; max-width: 960px; display: flex; align-items: center; gap: 16px; padding: 18px 24px; box-sizing: border-box;">
    <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;">Text distortion</div>
    <div style="flex: 1;"></div>
    <button onClick="{{ randomize }}" style="font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid #141210; padding: 7px 14px; cursor: pointer; color: #141210;" style-hover="background: #141210; color: #f4f1ea;">Rewarp</button>
    <button onClick="{{ randomSmears }}" style="font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid #141210; padding: 7px 14px; cursor: pointer; color: #141210;" style-hover="background: #141210; color: #f4f1ea;">Smear</button>
    <button onClick="{{ randomFields }}" style="font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid #141210; padding: 7px 14px; cursor: pointer; color: #141210;" style-hover="background: #141210; color: #f4f1ea;">Swirl</button>
    <button onClick="{{ randomBlobs }}" style="font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid #141210; padding: 7px 14px; cursor: pointer; color: #141210;" style-hover="background: #141210; color: #f4f1ea;">Blobs</button>
    <button onClick="{{ clearSmears }}" style="font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid #141210; padding: 7px 14px; cursor: pointer; color: #141210;" style-hover="background: #141210; color: #f4f1ea;">Clear smears</button>
    <button onClick="{{ captureGif }}" style="font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid #141210; padding: 7px 14px; cursor: pointer; color: #141210;" style-hover="background: #141210; color: #f4f1ea;">{{ gifLabel }}</button>
    <button onClick="{{ download }}" style="font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid #141210; padding: 7px 14px; cursor: pointer; color: #141210;" style-hover="background: #141210; color: #f4f1ea;">PNG ↓</button>
  </div>
  <div style="width: 100%; max-width: 960px; display: flex; align-items: center; gap: 10px; padding: 0 24px 14px; box-sizing: border-box;">
    <input value="{{ textValue }}" onChange="{{ onText }}" placeholder="text · separate lines with /" style="flex: 1; min-width: 120px; font-family: inherit; font-size: 12px; padding: 7px 10px; border: 1px solid #141210; background: #f4f1ea; color: #141210; outline: none;"></input>
    <select value="{{ fontVal }}" onChange="{{ onFont }}" style="font-family: inherit; font-size: 11px; padding: 7px 6px; border: 1px solid #141210; background: none; color: #141210; cursor: pointer;">
      <option value="Helvetica">Helvetica</option>
      <option value="Georgia">Georgia</option>
      <option value="'Times New Roman'">Times</option>
      <option value="'Courier New'">Courier</option>
      <option value="'Arial Black'">Arial Black</option>
    </select>
    <select value="{{ shapeVal }}" onChange="{{ onShape }}" style="font-family: inherit; font-size: 11px; padding: 7px 6px; border: 1px solid #141210; background: none; color: #141210; cursor: pointer;">
      <option value="Portrait">Portrait</option>
      <option value="Square">Square</option>
      <option value="Wide">Wide</option>
      <option value="Banner">Banner</option>
    </select>
    <label style="display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;">ink <input type="color" value="{{ inkVal }}" onChange="{{ onInk }}" style="width: 28px; height: 28px; padding: 0; border: 1px solid #141210; background: none; cursor: pointer;"></input></label>
    <label style="display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;">paper <input type="color" value="{{ paperVal }}" onChange="{{ onPaper }}" style="width: 28px; height: 28px; padding: 0; border: 1px solid #141210; background: none; cursor: pointer;"></input></label>
  </div>
  <div style="font-size: 11px; letter-spacing: 0.08em; opacity: 0.55; padding-bottom: 14px;">drag vertically over the text to smear the ink · warp &amp; smear character in Tweaks</div>
  <canvas width="900" height="1150" ref="{{ canvasRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" style="width: min(92vw, 620px); height: auto; box-shadow: 0 18px 50px rgba(20,18,16,0.35); cursor: crosshair; touch-action: none; margin-bottom: 40px;"></canvas>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;text&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;horde&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot; },
  &quot;fontSize&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 118, &quot;min&quot;: 40, &quot;max&quot;: 220, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Content&quot; },
  &quot;animate&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot; },
  &quot;speed&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.1, &quot;max&quot;: 3, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Motion&quot; },
  &quot;waveAmp&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 26, &quot;min&quot;: 0, &quot;max&quot;: 90, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Warp&quot; },
  &quot;waveFreq&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1.4, &quot;min&quot;: 0.3, &quot;max&quot;: 5, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Warp&quot; },
  &quot;tremor&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 3.5, &quot;min&quot;: 0, &quot;max&quot;: 14, &quot;step&quot;: 0.5, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Warp&quot; },
  &quot;smearAngle&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0, &quot;min&quot;: -45, &quot;max&quot;: 45, &quot;unit&quot;: &quot;°&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Smears&quot; },
  &quot;angleJitter&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 12, &quot;min&quot;: 0, &quot;max&quot;: 45, &quot;unit&quot;: &quot;°&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Smears&quot; },

}">

      animate: p.animate ?? true,
      speed: p.speed ?? 1,
      fontSize: p.fontSize ?? 118,
      waveAmp: p.waveAmp ?? 26,

      tremor: p.tremor ?? 3.5,

      angleJitter: p.angleJitter ?? 12,
      waveJitter: p.waveJitter ?? 0.5

  }
  renderSource() {

  warp() {

  }
  renderAll() { if (!this.src) return; this.renderSource(); this.warp(); }
  async captureGif() {

  renderVals() {

      fontVal: this.state.font,
      shapeVal: this.state.shape,
      inkVal: this.state.ink,
      paperVal: this.state.paper,

        const n = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) {
          this.strokes.push({
            x0: W * (0.15 + Math.random() * 0.7),
            y0: H * (0.25 + Math.random() * 0.5),
            amp: (Math.random() < 0.5 ? -1 : 1) * (50 + Math.random() * 120),
            rad: 30 + Math.random() * 60,
            r1: Math.random(), r2: Math.random(),
            blob: true, cyc: 1 + Math.floor(Math.random() * 2), bph: Math.random() * 6.283
          });
        }
        this.warp();
      },
      randomSmears: () => {
        const { W, H } = this.dims();
        const n = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) {
          this.strokes.push({
            x0: W * (0.15 + Math.random() * 0.7),
            y0: H * (0.25 + Math.random() * 0.5),
            amp: (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 110),
            rad: 30 + Math.random() * 60,
            r1: Math.random(), r2: Math.random()
          });
        }
        this.warp();
      },
      download: () => {
        this.canvasRef.current.toBlob(b => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(b); a.download = 'distorted-text.png'; a.click();
        });
      },
      onDown: (e) => {
        const { x, y } = this.pt(e);
        const stroke = { x0: x, y0: y, amp: 0, rad: 46, r1: Math.random(), r2: Math.random() };
        this.strokes.push(stroke);
        this.drag = stroke;
        e.target.setPointerCapture(e.pointerId);
      },
      onMove: (e) => {
        if (!this.drag) return;
        const { x, y } = this.pt(e);
        this.drag.amp = y - this.drag.y0;
        this.drag.rad = 46 + Math.abs(x - this.drag.x0) * 0.6;
        if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = 0; this.warp(); });
      },
      onUp: () => {
        if (!this.drag) return;
        if (Math.abs(this.drag.amp) < 6) this.strokes.pop();
        this.drag = null; this.warp();
      }
    };
  }
}
</script>
